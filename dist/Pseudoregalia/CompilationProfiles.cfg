{
	"profiles": [
		{
			"name": "Build and run",
			"tasks": [
				{
					"parameters": "\"${WORK_DIR_PATH}/${MAP_FULL_NAME}\" \"${GAME_DIR_PATH}/pseudoregalia/Content/Paks/${MAP_BASE_NAME}_p.pak\"",
					"tool": "${pseudochef}",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				},
				{
					"parameters": "\"/Game/Mods/Maps/${MAP_BASE_NAME}\"",
					"tool": "${GAME_DIR_PATH}/pseudoregalia.exe",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				}
			],
			"workdir": "${MAP_DIR_PATH}"
		},
		{
			"name": "Dump game assets",
			"tasks": [
				{
					"parameters": "\"${GAME_DIR_PATH}\"",
					"tool": "${dump_assets}",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				}
			],
			"workdir": "${MAP_DIR_PATH}"
		}
	],
	"version": 1
}
