{
    version: 9,
    name: "Pseudoregalia",
    icon: "Icon.png",
    "fileformats": [
        { "format": "Standard", "initialmap": "initial_standard.map" }
    ],
    "filesystem": {
        "searchpath": ".",
        "packageformat": { "extension": "", "format": "" }
    },
    "materials": {
        "root": "textures",
        "format": { "extensions": [], "format": "image" }
    },
    "entities": {
        "definitions": [ "Pseudoregalia.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "tags": {
        "brush": [
            {
                "name": "Trigger",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "trigger*",
                "material": "trigger" // set this material when tag is enabled
            }
        ],
        "brushface": [
            {
                "name": "Liquid",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "\**"
            }
        ]
    },
    "faceattribs": {
        "surfaceflags": [],
        "contentflags": []
    },
    "compilationTools": [
        { "name": "pseudochef" }
    ]
}
